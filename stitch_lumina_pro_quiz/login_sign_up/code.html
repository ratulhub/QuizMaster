<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md text-on-surface antialiased">
<main class="w-full max-w-[480px]">
<!-- Main Card -->
<div class="bg-surface rounded-xl shadow-level-1 p-xl border border-outline-variant/10">
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-primary font-bold tracking-tight">QuizPro</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Sign in to continue your learning journey.</p>
</div>
<!-- Toggle (Login/Signup) -->
<div class="bg-surface-container p-xs rounded-full flex mb-xl relative">
<button class="flex-1 py-sm rounded-full bg-surface shadow-level-1 text-primary font-label-lg text-label-lg transition-all z-10">
                    Log In
                </button>
<button class="flex-1 py-sm rounded-full text-on-surface-variant font-label-lg text-label-lg hover:text-on-surface transition-all z-10">
                    Sign Up
                </button>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Email Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full rounded-full border border-outline-variant bg-surface pl-[56px] pr-gutter py-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative">
<span class="material-symbols-outlined absolute left-gutter top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full rounded-full border border-outline-variant bg-surface pl-[56px] pr-gutter py-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all" placeholder="Password" required="" type="password"/>
<button class="absolute right-gutter top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between px-xs mt-xs">
<label class="flex items-center gap-xs cursor-pointer group">
<div class="w-4 h-4 rounded-sm border border-outline-variant group-hover:border-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-surface opacity-0">check</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">Remember me</span>
</label>
<a class="font-label-lg text-label-lg text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary rounded-full py-md mt-sm font-label-lg text-label-lg shadow-level-2 hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xl">
<div class="h-px bg-outline-variant/30 flex-1"></div>
<span class="font-body-md text-body-md text-on-surface-variant">Or continue with</span>
<div class="h-px bg-outline-variant/30 flex-1"></div>
</div>
<!-- Social Logins -->
<div class="flex flex-col gap-sm">
<button class="w-full bg-surface border border-outline-variant text-on-surface rounded-full py-md px-gutter font-label-lg text-label-lg hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-sm relative" type="button">
<!-- Placeholder for Google Logo -->
<svg class="w-5 h-5 absolute left-gutter" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
<button class="w-full bg-surface border border-outline-variant text-on-surface rounded-full py-md px-gutter font-label-lg text-label-lg hover:bg-surface-container-highest transition-colors flex items-center justify-center gap-sm relative" type="button">
<!-- Placeholder for LinkedIn Logo -->
<svg class="w-5 h-5 absolute left-gutter" fill="#0A66C2" viewbox="0 0 24 24">
<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path>
</svg>
                    Continue with LinkedIn
                </button>
</div>
</div>
<!-- Footer Links -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                By continuing, you agree to QuizPro's 
                <a class="text-primary hover:underline" href="#">Terms of Service</a> and 
                <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
            </p>
